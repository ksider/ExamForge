<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExamForge</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <div>
          <p class="eyebrow">LanguageCert Practice</p>
          <h1>ExamForge</h1>
        </div>
        <div id="headerSettings" class="header-settings is-hidden" aria-label="Test settings">
          <fieldset class="compact-settings-group">
            <legend>Timer</legend>
            <label class="compact-setting-pill">
              <input type="radio" name="timerMode" value="exam" checked />
              <span>Exam</span>
            </label>
            <label class="compact-setting-pill">
              <input type="radio" name="timerMode" value="practice" />
              <span>Practice</span>
            </label>
          </fieldset>
          <fieldset class="compact-settings-group">
            <legend>Scope</legend>
            <label class="compact-setting-pill">
              <input type="radio" name="timerScope" value="section" checked />
              <span>Section</span>
            </label>
            <label class="compact-setting-pill">
              <input type="radio" name="timerScope" value="test" />
              <span>Whole</span>
            </label>
          </fieldset>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="mobileTestsToggle" class="secondary-button mobile-tests-toggle is-hidden" type="button">Tests</button>
        <div id="timerPanel" class="timer-panel is-hidden" aria-live="polite"></div>
        <button id="topbarExitBtn" class="secondary-button topbar-exit-button is-hidden" type="button">Exit
          test</button>
      </div>
    </header>

    <main>
      <section id="startScreen" class="screen start-screen">
        <div id="testsSidebarBackdrop" class="tests-sidebar-backdrop"></div>
        <div class="start-screen-shell">
          <div class="start-screen-main">
            <div class="section-head">
              <div>
                <h2>Choose a test variant</h2>
                <p>Pick a variant from the sidebar or continue from your last saved attempt.</p>
              </div>
              <button id="refreshTests" class="icon-button" type="button" title="Refresh list">↻</button>
            </div>

            <button id="startBtn" class="primary-button" type="button" disabled>Start test</button>

            <section class="local-results">
              <h3>Recent local results</h3>
              <div id="resultHistory" class="result-history"></div>
            </section>
          </div>
        </div>

        <aside id="testsSidebar" class="tests-sidebar" aria-label="Choose a test">
          <div class="tests-sidebar-head">
            <h3>Choose a test</h3>
            <button id="testsSidebarClose" class="icon-button" type="button" aria-label="Close tests">×</button>
          </div>
          <div id="testsList" class="tests-grid"></div>
        </aside>
      </section>

      <section id="examScreen" class="screen is-hidden">
        <nav id="sectionTabs" class="tabs" aria-label="Exam sections"></nav>
        <div id="examContent"></div>
      </section>

      <section id="resultsScreen" class="screen is-hidden">
        <div class="section-head">
          <div>
            <h2>Test results</h2>
            <p id="resultSubtitle"></p>
          </div>
          <button id="restartBtn" class="secondary-button" type="button">Back to tests</button>
        </div>
        <div id="resultsContent" class="results-grid"></div>
      </section>
    </main>
  </div>

  <dialog id="promptModal" class="modal">
    <div class="modal-content">
      <h3>Edit Writing Prompt</h3>
      <textarea id="promptModalText" class="input-line writing-box" rows="8"
        placeholder="Enter your custom writing task here..."></textarea>
      <div class="modal-actions">
        <button id="promptModalCancel" class="secondary-button" type="button">Cancel</button>
        <button id="promptModalSave" class="primary-button" type="button" style="margin-top: 0;">Save</button>
      </div>
    </div>
  </dialog>

  <script src="/app.js" defer></script>
</body>

</html>
